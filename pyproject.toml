[project]
name = "varve"
# release-please owns this value. The first release PR bumps it to 0.1.0.
version = "0.8.0"
description = "Python-defined pipelines with code-aware materialized caching."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Bob Wang" }]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "netext>=0.5,<0.6",
    "pydantic>=2.0.0",
    "pydantic-settings[yaml]>=2.0.0",
    "rich>=13.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tqdm>=4.66.0",
    "typing-extensions>=4.12.0",
]

[project.urls]
Repository = "https://github.com/moeakwak/varve"
Issues = "https://github.com/moeakwak/varve/issues"
Changelog = "https://github.com/moeakwak/varve/blob/main/CHANGELOG.md"

[project.scripts]
varve = "varve.workspace.cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]
ui = [
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/varve"]

[tool.pytest.ini_options]
markers = ["slow: slower end-to-end tests (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests bind pipeline classes returned by fixtures to CamelCase names.
"tests/*" = ["N803", "N806"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.10"
include = ["src/varve", "tests"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
